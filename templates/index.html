<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peak Decline</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1a1c2c 0%, #4a192c 100%);
            --sidebar-bg: rgba(0, 0, 0, 0.3);
            --card-bg: rgba(255, 255, 255, 0.1);
            --card-hover: rgba(255, 255, 255, 0.2);
            --accent: #ff4444;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        /* --- GRID LAYOUT (3 Columns now) --- */
        .app-layout {
            display: grid;
            grid-template-columns: 300px 1fr 250px; /* Left | Main | Right */
            grid-template-rows: 100vh;
            height: 100vh;
        }

        /* --- SIDEBARS (Shared Styles) --- */
        .sidebar, .user-sidebar {
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .sidebar { border-right: 1px solid rgba(255,255,255,0.1); }
        .user-sidebar { border-left: 1px solid rgba(255,255,255,0.1); }

        .sidebar h2, .user-sidebar h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        #favorites-container { display: flex; flex-direction: column; gap: 10px; }

        /* --- USER LIST STYLES --- */
        .user-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.8);
            transition: 0.2s;
        }
        .user-item:hover { background: rgba(255,255,255,0.1); color: white; }
        .user-avatar { font-size: 1.2rem; }

        /* --- MAIN CONTENT --- */
        .main-content {
            padding: 20px 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }

        .top-header {
            display: grid;
            grid-template-columns: 100px 1fr 100px; /* Balance the title center */
            align-items: center;
            flex-shrink: 0;
            margin-bottom: 5px;
        }

        .brand-title {
            grid-column: 2;
            display: flex;             /* Use flex to center the image */
            justify-content: center;   /* Center horizontally */
            align-items: center;       /* Center vertically */
            height: 60px;              /* Set a fixed height for the header area */
        }

        .brand-title img {
            max-height: 100%;          /* Ensure image fits within the height */
            max-width: 100%;           /* Ensure image fits within width */
            object-fit: contain;       /* Keep aspect ratio */
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); /* Optional: Adds a shadow */
        }

        .logout-btn {
            grid-column: 1;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex; align-items: center; gap: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            width: fit-content;
        }
        .logout-btn:hover {
            background: rgba(255, 68, 68, 0.2);
            color: white;
            border-color: rgba(255, 68, 68, 0.5);
        }

        /* --- NOW PLAYING BAR (New) --- */
        .now-playing-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.3);
            padding: 8px 20px;
            border-radius: 30px;
            width: fit-content;
            margin: 0 auto 10px auto;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .live-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #666;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .live-dot.active { background: #00ff00; box-shadow: 0 0 8px #00ff00; }
        .live-dot.loading { background: #ffd700; animation: pulse 1s infinite; }

        /* --- VIDEO PLAYER --- */
        .video-wrapper {
            width: 100%;
            max-width: 1400px; /* Slightly smaller to fit layout */
            margin: 0 auto;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            position: relative;
            flex-shrink: 0;
        }
        @supports (aspect-ratio: 16/9) {
            .video-wrapper { padding-bottom: 0; height: auto; aspect-ratio: 16/9; }
        }

        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .overlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: rgba(0,0,0,0.8);
            z-index: 10;
            cursor: pointer;
        }
        .hidden { display: none !important; }

        /* Controls */
        .controls-bar {
            display: flex; justify-content: center; gap: 20px; align-items: center;
            margin-top: 5px; flex-shrink: 0; width: 100%;
        }

        .search-input {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 20px; border-radius: 8px; color: white; width: 300px; outline: none;
        }
        .search-input:focus { border-color: var(--accent); }

        .btn {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 10px 20px; border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { background: var(--card-hover); }

        /* Channels */
        .section-title {
            margin-top: 10px; font-size: 1.2rem; color: var(--text-muted); flex-shrink: 0;
            text-align: left; width: 100%; max-width: 1400px; margin-left: auto; margin-right: auto;
        }

        #channels-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px;
            padding-bottom: 40px; width: 100%; max-width: 1400px; margin-left: auto; margin-right: auto;
        }

        .channel-card {
            background: var(--card-bg); padding: 12px; border-radius: 8px; cursor: pointer;
            transition: all 0.2s; border: 1px solid transparent; position: relative;
            display: flex; flex-direction: column; justify-content: center;
        }
        .channel-card:hover { background: var(--card-hover); transform: translateY(-2px); }
        .channel-card.playing { border-color: var(--accent); background: rgba(255, 68, 68, 0.1); }
        .channel-card h3 { font-size: 1rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-card small { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fav-star { position: absolute; right: 10px; top: 10px; background: none; border: none; cursor: pointer; font-size: 1.1rem; }

        /* Sidebar channel overrides */
        .sidebar .channel-card { flex-direction: row; align-items: center; justify-content: space-between; }
        .sidebar .channel-card h3 { font-size: 0.9rem; margin: 0; }
        .sidebar .channel-card small { display: none; }
        .sidebar .fav-star { position: static; font-size: 0.9rem; }

        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #fff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .notification {
            position: fixed; top: 20px; right: 20px; background: #222; padding: 15px; border-radius: 8px;
            border-left: 4px solid var(--accent); transform: translateX(200%); transition: 0.3s; z-index: 1000;
        }
        .notification.show { transform: translateX(0); }

        /* Responsive */
        @media (max-width: 1100px) {
            .app-layout { grid-template-columns: 250px 1fr; }
            .user-sidebar { display: none; /* Hide users on tablets, or make togglable */ }
        }

        @media (max-width: 900px) {
            .app-layout { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height: auto; }
            body { overflow-y: auto; }
            .sidebar { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); max-height: 200px; order: 2; }
            .user-sidebar { display: none; }
            .main-content { order: 1; padding: 15px; overflow: visible; }
            .video-wrapper { position: sticky; top: 0; z-index: 50; max-width: 100%; }
            #channels-container { order: 3; }
            .top-header { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 15px; }
            .now-playing-bar { width: 100%; margin-bottom: 10px; }
            .controls-bar { flex-direction: column; align-items: stretch; gap: 10px; }
            .search-input { width: 100%; }
            .logout-btn { order: 3; width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="app-layout">
    <!-- LEFT SIDEBAR: Favorites -->
    <aside class="sidebar">
        <h2>Favorites</h2>
        <div id="favorites-container">
            <div style="padding:10px; opacity:0.6; font-style:italic;">No favorites yet...</div>
        </div>
    </aside>

    <!-- CENTER: Main Content -->
    <main class="main-content">
        <header class="top-header">
            <a href="/logout" class="logout-btn">
                <span>🚪</span> Logout
            </a>
            <div class="brand-title">
                <img src="/static/logo.png">
            </div>
            <div><!-- Spacer --></div>
        </header>

        <!-- CENTERED STATUS BAR -->
        <div class="now-playing-bar">
            <div id="status-dot" class="live-dot"></div>
            <span id="status-text">Ready</span>
        </div>

        <div class="video-wrapper">
            <div id="loading-overlay" class="overlay">
                <h2>Select a Channel</h2>
            </div>
            <video id="video-player" controls autoplay muted playsinline webkit-playsinline></video>
        </div>

        <div class="controls-bar">
            <button class="btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
            <input type="text" class="search-input" id="search" placeholder="Search channels..." oninput="filterChannels()">
            <!-- Link to Plex -->
            <a href="/plex-watch-together" class="btn" style="text-decoration:none;">Plex Watch Party</a>
        </div>

        <h3 class="section-title">All Channels</h3>
        <div id="channels-container"></div>
    </main>

    <!-- RIGHT SIDEBAR: Users -->
    <aside class="user-sidebar">
        <h2 style="display:flex; justify-content:space-between;">
            Users Online <span id="online-count" style="color:white; font-size:0.9rem;">0</span>
        </h2>
        <div id="user-list">
            <!-- Users injected here -->
        </div>
    </aside>
</div>

<div id="notification" class="notification"></div>

<script>
    const socket = io();
    const video = document.getElementById('video-player');
    const overlay = document.getElementById('loading-overlay');
    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('status-dot');

    // New Elements
    const onlineCountSpan = document.getElementById('online-count');
    const userListContainer = document.getElementById('user-list');

    const channelsContainer = document.getElementById('channels-container');
    const favoritesContainer = document.getElementById('favorites-container');

    let hls = null;
    let channels = [];
    let currentChannelId = null;
    let isPlayerInitialized = false;

    const STREAM_URL = '/stream/stream.m3u8';

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) { registration.unregister(); }
        });
    }

    loadChannels();

    socket.on('connect', () => {
        notify('Connected');
        fetch('/api/status').then(r=>r.json()).then(data => {
            handleStatusUpdate(data);
        });
    });

    socket.on('channel_changed', (data) => {
        currentChannelId = data.channel_id;
        const channelName = getChannelName(currentChannelId);

        updateUI();
        notify(`Switched to: ${channelName}`);

        setStatus('loading', `Loading: ${channelName}...`);
        setLoading(true, `Switching to ${channelName}...`);

        setTimeout(() => initPlayer(), 1500);
    });

    socket.on('stream_stopped', () => {
        currentChannelId = null;
        updateUI();
        setLoading(true, "Stream Stopped");
        destroyPlayer();
    });

    socket.on('status', (data) => handleStatusUpdate(data));

    function getChannelName(id) {
        if (!channels || channels.length === 0) return "Loading...";
        const found = channels.find(c => c.id === id);
        return found ? found.name : 'Unknown Channel';
    }

    function handleStatusUpdate(data) {
        if (data.is_streaming && data.current_channel_id) {
            currentChannelId = data.current_channel_id;
            const name = getChannelName(currentChannelId);
            setStatus('active', `Streaming: ${name}`);
            updateUI();

            if (!isPlayerInitialized) {
                notify(`Joining ${name}...`);
                setLoading(true, `Joining ${name}...`);
                initPlayer();
            }
        } else {
            setStatus('idle', 'Ready');
        }
    }

    async function playChannel(id) {
        if (id === currentChannelId) {
            notify("Already watching this channel!");
            video.muted = false;
            if(video.paused) video.play();
            return;
        }
        try {
            setLoading(true, "Requesting Stream...");
            await fetch(`/api/play/${id}`, { method: 'POST' });
        } catch(e) { notify("Failed to switch"); }
    }

    function initPlayer() {
        isPlayerInitialized = true;
        if (hls) { hls.destroy(); hls = null; }
        video.pause();
        video.removeAttribute('src');
        video.load();

        const uniqueSrc = `${STREAM_URL}?session=${Date.now()}`;

        if (Hls.isSupported()) {
            hls = new Hls({
                manifestLoadingTimeOut: 10000,
                enableWorker: false,
                xhrSetup: function(xhr, url) {
                    const separator = url.includes('?') ? '&' : '?';
                    xhr.open('GET', url + separator + 't=' + Date.now(), true);
                }
            });
            hls.loadSource(uniqueSrc);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                setLoading(false);
                var playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log("Autoplay prevented.");
                        showClickToPlay();
                    });
                }
                const name = getChannelName(currentChannelId);
                setStatus('active', `Streaming: ${name}`);
            });
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
                    else hls.destroy();
                }
            });
        }
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = uniqueSrc;
            video.addEventListener('loadedmetadata', () => {
                setLoading(false);
                const name = getChannelName(currentChannelId);
                setStatus('active', `Streaming: ${name}`);
                video.play().catch(e => showClickToPlay());
            }, { once: true });
        }
    }

    function showClickToPlay() {
        overlay.classList.remove('hidden');
        overlay.innerHTML = `<h2>Stream Ready</h2><p>Click to Watch</p>`;
        overlay.onclick = () => {
            video.play();
            video.muted = false;
            overlay.classList.add('hidden');
        };
    }

    function destroyPlayer() {
        if (hls) { hls.destroy(); hls = null; }
        video.removeAttribute('src');
        video.load();
        isPlayerInitialized = false;
        setStatus('idle', "Ready");
    }

    async function loadChannels() {
        try {
            const res = await fetch('/api/channels');
            channels = await res.json();
            renderChannels();

            if (currentChannelId && statusDot.classList.contains('active')) {
                 const name = getChannelName(currentChannelId);
                 setStatus('active', `Streaming: ${name}`);
            }
        } catch(e) { console.error(e); }
    }

    async function toggleFavorite(id) {
        const chan = channels.find(c => c.id === id);
        if(chan) {
             chan.Favorites = !chan.Favorites;
             renderChannels();
        }
    }

    function renderChannels() {
        const term = document.getElementById('search').value.toLowerCase();
        const filtered = channels.filter(c => c.name.toLowerCase().includes(term));
        const favorites = filtered.filter(c => c.Favorites);
        const all = filtered;

        if(favorites.length > 0) {
            favoritesContainer.innerHTML = favorites.map(c => `
                <div class="channel-card ${c.id === currentChannelId ? 'playing' : ''}" onclick="playChannel(${c.id})">
                    <h3>${c.name}</h3>
                    <button class="fav-star" onclick="event.stopPropagation(); toggleFavorite(${c.id})">⭐</button>
                </div>
            `).join('');
        } else {
            favoritesContainer.innerHTML = `<div style="padding:10px; opacity:0.6; font-style:italic;">No favorites found</div>`;
        }

        channelsContainer.innerHTML = all.map(c => `
            <div class="channel-card ${c.id === currentChannelId ? 'playing' : ''}" onclick="playChannel(${c.id})">
                <h3>${c.name}</h3>
                <small>${c.url}</small>
                <button class="fav-star" onclick="event.stopPropagation(); toggleFavorite(${c.id})">
                    ${c.Favorites ? '⭐' : '☆'}
                </button>
            </div>
        `).join('');
    }

    function updateUI() { renderChannels(); }
    function filterChannels() { renderChannels(); }

    function setLoading(isLoading, msg) {
        if (isLoading) {
            overlay.classList.remove('hidden');
            overlay.innerHTML = `<div class="spinner"></div><h3>${msg}</h3>`;
            setStatus('loading', msg);
            overlay.onclick = null;
        } else {
            overlay.classList.add('hidden');
        }
    }

    function setStatus(state, text) {
        statusText.innerText = text;
        statusDot.className = `live-dot ${state}`;
    }

    function notify(msg) {
        const n = document.getElementById('notification');
        n.innerText = msg; n.classList.add('show');
        setTimeout(() => n.classList.remove('show'), 3000);
    }

    function toggleFullscreen() {
        if (video.requestFullscreen) video.requestFullscreen();
        else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
    }

    setInterval(() => {
        // Keep session alive
        fetch('/api/heartbeat', {method:'POST'}).catch(()=>{});

        // Fetch user list and render vertically in sidebar
        fetch('/api/online_users')
            .then(r => r.json())
            .then(users => {
                if (Array.isArray(users)) {
                    onlineCountSpan.innerText = users.length;

                    // Render vertical list
                    userListContainer.innerHTML = users.map(u => `
                        <div class="user-item">
                            <span class="user-avatar">👤</span>
                            <span>${u}</span>
                        </div>
                    `).join('');
                }
            })
            .catch(e => console.error("User fetch error:", e));
    }, 5000);
</script>
</body>
</html>
